name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . -s tests/run_tests.gd

  export-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dir/"
      - name: Configure Godot Android settings and debug keystore
        run: |
          keytool -genkey -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          ver="${GODOT_VERSION%.*}"
          cat > "$HOME/.config/godot/editor_settings-${ver}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Import and export debug APK
        run: |
          godot --headless --path . --import || true
          mkdir -p build
          godot --headless --path . --export-debug Android build/longdarks-debug.apk
          test -s build/longdarks-debug.apk
      - name: Verify APK is launchable
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT" dump badging build/longdarks-debug.apk > badging.txt 2>&1 || true
          grep -E "^(package:|application-label:|sdkVersion|minSdkVersion|targetSdkVersion|native-code)" badging.txt
          # Godot's Android template declares its launcher as an <activity-alias>
          # (GodotAppLauncher) with MAIN/LAUNCHER, which `badging` never reports as
          # launchable-activity. Check the manifest for the alias intent-filter instead.
          "$AAPT" dump xmltree --file AndroidManifest.xml build/longdarks-debug.apk > manifest.txt 2>&1
          if grep -q "^launchable-activity" badging.txt; then
            echo "launchable-activity present"
          elif awk '/E: activity-alias/{a=1} a&&/android.intent.action.MAIN/{m=1} a&&/android.intent.category.LAUNCHER/{l=1} /E: (meta-data|receiver|provider|service)/{if(a)a=0} END{exit !(m&&l)}' manifest.txt \
               && grep -q 'android:exported.*=true' manifest.txt; then
            echo "Launcher activity-alias with MAIN/LAUNCHER found"
            grep -A12 "E: activity-alias" manifest.txt
          else
            echo "::error::APK has no launcher entry (no launcher icon)"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: longdarks-debug-apk
          path: build/*.apk
          if-no-files-found: error
